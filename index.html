<style>
:root{
  --red:#9E0000; --gold:#FFCC00; --on-red:#FFF4D6; --on-gold:#2A0A0A;
  --head:"Bricolage Grotesque","Helvetica Neue",Arial,sans-serif;
  --body:"Newsreader",Georgia,"Times New Roman",serif;
  box-sizing:border-box;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--red:#6E0000;--gold:#E0B400}
}
:root[data-theme="dark"]{--red:#6E0000;--gold:#E0B400}
*{box-sizing:border-box}
html,body{min-height:100%;margin:0}
body{background:var(--red);color:var(--on-red);font-family:var(--body);font-size:1.2rem;line-height:1.6;display:flex;flex-direction:column;min-height:100vh;padding-top:env(safe-area-inset-top,0px)}
:focus-visible{outline:3px solid var(--on-gold);outline-offset:3px}
header,footer{padding:1.25rem}
.brand{font-family:var(--head);font-weight:800;font-size:clamp(1.4rem,4vw,1.9rem)}
main{flex:1;background:var(--gold);color:var(--on-gold);display:flex;align-items:center;padding:2.5rem 1.25rem}
.inner{max-width:1040px;width:100%;margin:0 auto;display:grid;gap:2rem;align-items:center}
@media (min-width:860px){.inner{grid-template-columns:1.1fr 1fr;gap:3rem}}
.status{display:inline-flex;align-items:center;gap:.6rem;font-family:var(--head);font-weight:700;margin-bottom:1rem}
.dot{display:inline-block;vertical-align:middle;width:.18em;height:.18em;margin:0 .22em .08em 0;border-radius:50%;background:var(--red)}
h1{font-family:var(--head);font-weight:800;font-size:clamp(2.4rem,11vw,4.4rem);line-height:1;letter-spacing:-.03em;margin:0 0 1.5rem;white-space:nowrap}
@media (min-width:860px){h1{font-size:min(6.2vw,4.4rem)}}
p{max-width:40ch;margin:0 0 1.75rem}
.btn{display:inline-block;font-family:var(--head);font-weight:700;padding:.9rem 1.5rem;border-radius:6px;text-decoration:none;background:var(--red);color:var(--on-red)}
.btn:hover{filter:brightness(1.15)}

.about{background:#FFF8E1;color:#2A0A0A;padding:3rem 1.25rem}
.about div{max-width:1040px;margin:0 auto}
.about h2{font-family:var(--head);font-weight:800;font-size:1.8rem;margin:0 0 .5rem}
.about p{max-width:60ch;margin:0}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .about{background:#1C0D0D;color:#FFF4D6}}
footer{text-align:center;font-size:.95rem;padding-bottom:calc(1.25rem + env(safe-area-inset-bottom,0px))}
@media (prefers-reduced-motion:no-preference){.dot{animation:pulse 2s ease-in-out infinite}}
@keyframes pulse{50%{opacity:.35}}

.flag{border-radius:4px;box-shadow:0 10px 30px rgba(42,10,10,.35);width:100%;height:auto;aspect-ratio:3/2;display:block;overflow:hidden;cursor:pointer}
.flag *{transform-box:view-box}
.s1,.s3{animation:inL 1s cubic-bezier(.7,0,.2,1) backwards}
.s2{animation:inR 1s cubic-bezier(.7,0,.2,1) backwards}
@keyframes inL{from{transform:translateX(-1080px)}}
@keyframes inR{from{transform:translateX(1080px)}}
.el-l{animation:eleL .9s cubic-bezier(.2,.8,.2,1) 1.3s backwards}
.el-r{animation:eleR .9s cubic-bezier(.2,.8,.2,1) 1.3s backwards}
@keyframes eleL{from{transform:translateX(-520px)}}
@keyframes eleR{from{transform:translateX(520px)}}
.emb{transform-origin:540.5px 359.5px;animation:embIn .7s ease-out 1.9s backwards}
@keyframes embIn{from{opacity:0;transform:scale(.5) rotate(-90deg)}}
.stars{transform-origin:540.5px 359.5px;animation:spin 28s linear 2.1s infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.fl{transform-origin:540px 451px;animation:bloom 1.25s cubic-bezier(.2,.9,.3,1.2) 2.6s backwards,sway 6s ease-in-out 3.85s infinite}
@keyframes bloom{from{opacity:0;transform:scale(.2) rotate(-25deg)}}
@keyframes sway{25%{transform:rotate(2.5deg)}75%{transform:rotate(-2.5deg)}}
@media (prefers-reduced-motion:reduce){.flag *{animation:none!important}}
header{display:flex;align-items:center;justify-content:space-between;gap:1rem;padding-top:.6rem;padding-bottom:.6rem}
.hdr-wrap{height:clamp(46px,11vw,96px);width:auto;max-width:60%;text-align:right}
.hdr-img{height:100%;width:auto;max-width:100%;object-fit:contain;display:inline-block;transition:transform .5s cubic-bezier(.2,.8,.2,1);will-change:transform}
.hdr-img:hover,.hdr-img:focus-visible{transform:scale(1.18)}
.social{display:flex;justify-content:center;gap:.9rem;margin-bottom:.9rem}
.social a{display:inline-flex;align-items:center;justify-content:center;width:2.7rem;height:2.7rem;border-radius:50%;background:var(--gold);color:#2A0A0A;transition:transform .15s}
.social a:hover{transform:translateY(-2px)}
.social svg{width:1.3rem;height:1.3rem}
html{scroll-behavior:smooth}
.left{display:flex;align-items:center;flex-wrap:nowrap;gap:0 1.3rem;flex-shrink:0}
.menu{display:flex;flex-wrap:nowrap;gap:.2rem}
.menu a{white-space:nowrap}
header{flex-wrap:wrap}
.hdr-wrap{margin-left:auto}
@media (max-width:560px){
header{display:flex;flex-wrap:nowrap;align-items:center;gap:.5rem;padding-left:.9rem;padding-right:.9rem}
.left{display:flex;flex-wrap:nowrap;align-items:center;gap:.4rem;flex-shrink:0}
.brand{font-size:clamp(.95rem,4.4vw,1.2rem);white-space:nowrap}
.menu{border-top:0;padding-top:0;justify-content:flex-start;gap:0}
.menu a{font-size:clamp(.7rem,3.3vw,.85rem);padding:.3rem .4rem}
.hdr-wrap{flex:1 1 0;min-width:0;max-width:none;height:38px;margin-left:0}
}
.menu a{color:inherit;text-decoration:none;font-family:var(--head);font-weight:600;font-size:.95rem;padding:.3rem .8rem;border-radius:999px}
.menu a:hover,.menu a:focus-visible{background:var(--gold);color:#2A0A0A}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
header{flex-wrap:nowrap;gap:.6rem 1rem}
.hdr-wrap{flex:1 1 0;min-width:0;max-width:none;margin-left:0;height:clamp(40px,11vw,96px)}

.flagcol{position:relative;min-width:0}
#flagwrap{position:relative}
.dots{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .6s ease}
.dots.ready{opacity:1}
.dots.ready .dot-btn{pointer-events:auto}
.dot-btn{position:absolute;width:clamp(24px,3.9%,36px);aspect-ratio:1;transform:translate(-50%,-50%);border:0;border-radius:50%;padding:0;background:rgba(255,255,255,.96);cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.3);transition:background .3s,transform .3s}
.dot-btn::after{content:"";position:absolute;inset:-10px;border-radius:50%}
.dot-btn::before{content:"";position:absolute;inset:-70%;border-radius:50%;background:rgba(47,128,237,.28);opacity:0;transform:scale(.4);transition:opacity .35s,transform .45s cubic-bezier(.2,.9,.3,1.2)}
.dot-btn.on{background:#2F80ED;transform:translate(-50%,-50%) scale(1.05)}
.dot-btn.on::before{opacity:1;transform:scale(1)}
@media (prefers-reduced-motion:no-preference){.dot-btn.on::before{animation:ring 2s ease-in-out infinite}}
@keyframes ring{50%{transform:scale(1.18);opacity:.6}}
.fdetail{--card:#FFF8E1;--ink:#5B4A4A;--ttl:#9E0000;position:absolute;z-index:6;left:0;top:0;width:min(23rem,100%);display:flex;flex-direction:column;gap:1rem;pointer-events:none;opacity:0;visibility:hidden;transform:translateY(14px) scale(.97);transform-origin:bottom center;transition:opacity .35s ease,transform .5s cubic-bezier(.2,.9,.3,1.15),visibility 0s .35s}
.fdetail.show{opacity:1;visibility:visible;transform:none;transition:opacity .35s ease,transform .5s cubic-bezier(.2,.9,.3,1.15),left .4s ease,top .4s ease,visibility 0s}
.fdetail.below{transform-origin:top center;transform:translateY(-14px) scale(.97)}
.fdetail.below.show{transform:none}
.fdetail::after{content:"";position:absolute;left:var(--ax,50%);bottom:-10px;transform:translateX(-50%);border-left:10px solid transparent;border-right:10px solid transparent;border-top:11px solid var(--red)}
.fdetail.below::after{bottom:auto;top:-10px;border-top:0;border-bottom:11px solid var(--red)}
.fmedia svg{display:block;width:100%;height:100%}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .fdetail{--card:#1C0D0D;--ink:#E8D9B5;--ttl:#E0B400}}
:root[data-theme="dark"] .fdetail{--card:#1C0D0D;--ink:#E8D9B5;--ttl:#E0B400}
.fcard{background:var(--red);border-radius:14px;padding:.6rem;box-shadow:0 10px 30px rgba(42,10,10,.35)}
.fcard-in{background:var(--card);border-radius:10px;padding:1rem 1.1rem;display:grid}
.fpanel{grid-area:1/1;display:grid;grid-template-columns:clamp(70px,22%,104px) 1fr;gap:1rem;align-items:center;opacity:0;visibility:hidden;transform:translateY(12px) scale(.96);transition:opacity .4s ease,transform .55s cubic-bezier(.2,.9,.3,1.15),visibility 0s .4s}
.fpanel.on{opacity:1;visibility:visible;transform:none;transition-delay:0s}
.fmedia{aspect-ratio:1;border-radius:8px;background-size:contain;background-repeat:no-repeat;background-position:center}
.fpanel h3{font-family:var(--head);font-weight:800;font-size:1.35rem;line-height:1.15;color:var(--ttl);margin:0 0 .35rem}
.fpanel p{font-size:1rem;line-height:1.45;color:var(--ink);margin:0;max-width:none}
.fthumbs{display:flex;justify-content:center;gap:.6rem}
.fthumb{width:clamp(40px,12%,56px);aspect-ratio:1;padding:3px;border:2px solid transparent;border-radius:10px;background:transparent;cursor:pointer;transition:border-color .3s,transform .3s}
.fthumb .fmedia{width:100%;height:100%;aspect-ratio:auto;border-radius:6px}
.fthumb.on{border-color:var(--red);transform:translateY(-2px)}
@media (prefers-reduced-motion:reduce){.fdetail,.fdetail.show,.fpanel,.dot-btn,.dot-btn::before,.fthumb,.dots{transition:none}}
.music{position:fixed;right:max(1rem,env(safe-area-inset-right,0px));bottom:calc(1rem + env(safe-area-inset-bottom,0px));z-index:10;width:3rem;height:3rem;border:0;border-radius:50%;background:var(--gold);color:#2A0A0A;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.35);transition:transform .2s}
.music:hover{transform:scale(1.06)}
.music[hidden]{display:none}
.music svg{width:1.5rem;height:1.5rem}
.music .off{display:none}
.music.muted .on{display:none}
.music.muted .off{display:block}
html[lang="ta"]{--head:"Noto Sans Tamil","Bricolage Grotesque",sans-serif;--body:"Noto Sans Tamil",Georgia,serif}
html[lang="ta"] h1{line-height:1.3;letter-spacing:0}
html[lang="ta"] .fpanel p{line-height:1.6}
html[lang="ta"] .ldr-card.open .ldr-desc{font-size:15px;line-height:1.5;top:57%}
html[lang="ta"] .ldr-card.open .ldr-name{font-size:clamp(1.1rem,2.2vw,1.65rem)}
main{position:relative;padding-top:4rem}
.lang{position:absolute;top:.9rem;right:max(1.25rem,env(safe-area-inset-right,0px));z-index:5;font-family:var(--head);font-weight:700;font-size:.95rem;line-height:1.2;padding:.35rem .9rem;border-radius:999px;border:2px solid var(--red);background:transparent;color:var(--on-gold);cursor:pointer;white-space:nowrap}
.lang:hover,.lang:focus-visible{background:var(--red);color:var(--on-red)}


.hdr-wrap{position:relative;display:inline-block;cursor:pointer}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.4);-webkit-backdrop-filter:blur(1.5px);backdrop-filter:blur(1.5px);opacity:0;visibility:hidden;transition:opacity .2s ease,visibility 0s linear .2s;z-index:45;pointer-events:none}
.hdr-wrap.show .scrim{opacity:1;visibility:visible;transition:opacity .2s ease,visibility 0s linear 0s}
.leaders{display:flex;flex-direction:column;gap:.6rem;box-sizing:border-box;position:fixed;top:50%;left:50%;width:min(88vw,1180px);height:min(76vh,640px);max-height:calc(100vh - 2 * env(safe-area-inset-top,0px) - 2rem);background:#fff;border-radius:20px;box-shadow:0 30px 80px rgba(0,0,0,.5);padding:1rem 1.1rem 1.1rem;opacity:0;visibility:hidden;transform:translate(-50%,-50%) scale(.96);transition:opacity .18s ease,transform .18s ease,visibility 0s linear .18s;z-index:50}
.hdr-wrap.show .leaders{opacity:1;visibility:visible;transform:translate(-50%,-50%) scale(1);transition:opacity .18s ease,transform .18s ease}
@media (max-width:760px){.leaders{width:min(92vw,560px);height:min(80vh,540px)}}
.leaders-title{margin:0;flex:0 0 auto;font-family:var(--head);font-weight:800;font-size:clamp(1.1rem,2.4vw,1.5rem);letter-spacing:.01em;color:var(--red)}
.ldr-row{display:flex;align-items:stretch;gap:.6rem;flex:1;min-height:0}
.ldr-card{position:relative;flex:0 0 84px;border-radius:16px;overflow:hidden;background:#F3ECDA;cursor:pointer;border:0;padding:0;transition:flex-basis .6s cubic-bezier(.22,.8,.25,1),background .4s;box-shadow:0 3px 14px rgba(0,0,0,.14);text-align:left}
.ldr-card.open{flex:1 1 420px;background:linear-gradient(160deg,var(--red),#6E0000)}
.ldr-card img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:bottom center;display:block;pointer-events:none}
.ldr-card.open img{object-fit:contain;object-position:bottom right}
.ldr-name{position:absolute;left:0;right:0;bottom:0;padding:1.4rem .7rem .5rem;font-family:var(--head);font-weight:700;font-size:.78rem;line-height:1.2;color:#fff;z-index:2;background:linear-gradient(to top,rgba(20,4,4,.75),transparent)}
.ldr-card.open .ldr-name{top:1.15rem;left:1.15rem;right:auto;bottom:auto;padding:0;background:none;color:#FFF3D6;font-weight:800;font-size:clamp(1.2rem,2.4vw,1.8rem);letter-spacing:-.01em;max-width:54%}
.ldr-toggle{position:absolute;top:.6rem;right:.6rem;width:1.9rem;height:1.9rem;border-radius:8px;border:0;background:rgba(0,0,0,.35);color:#fff;font-size:1.1rem;line-height:1;display:flex;align-items:center;justify-content:center;z-index:3;pointer-events:none;font-family:var(--head);font-weight:700}
.ldr-card.open .ldr-toggle{background:rgba(255,255,255,.2);color:#fff}
.ldr-desc{position:absolute;left:1.15rem;right:1.15rem;top:50%;bottom:auto;transform:translateY(-50%);max-width:52%;color:#FFF3D6;font-family:var(--body);font-size:16.7px;line-height:1.6;opacity:0;transition:opacity .35s .1s;z-index:2}
.ldr-card.open .ldr-desc{opacity:1}
@media (max-width:760px){
  .leaders{padding:.8rem .8rem .9rem}
  .ldr-card{flex-basis:56px}
  .ldr-name{font-size:.66rem;padding:1.1rem .45rem .4rem}
  .ldr-card.open .ldr-name{max-width:100%;font-size:1.1rem;top:.9rem;left:.9rem}
  .ldr-desc{display:none}
  .ldr-toggle{width:1.5rem;height:1.5rem;font-size:.9rem;top:.4rem;right:.4rem}
}
</style>

<script>

const parts=[
  {t:"Blood Red",x:.779,y:.129,c:"#A00000",d:"The top and bottom bands are deep blood-red, or maroon: revolution, control, responsibility and strategic thinking."},

function svgEl(n,a){const e=document.createElementNS(NS,n);for(const k in a)e.setAttribute(k,a[k]);return e;}
function emblem(kind){

  const fc=detail.parentElement,W=fc.clientWidth,H=fc.clientHeight,cw=detail.offsetWidth,ch=detail.offsetHeight;
  const dx=parts[n].x*W,dy=parts[n].y*H,r=dots[n].offsetHeight/2+14;

  a.addEventListener("error",function(){b.hidden=true;});

  b.addEventListener("click",function(e){e.stopPropagation();
    if(a.paused){userPaused=false;a.play().then(function(){ramp(LEVEL,1500);});}
    else{userPaused=true;ramp(0,800,function(){a.pause();});}
  });
})();
</script>

<script>
(function(){
  var cards=document.querySelectorAll(".ldr-card");
  cards.forEach(function(c){
    c.addEventListener("click",function(){
      cards.forEach(function(x){
        x.classList.remove("open");
        x.querySelector(".ldr-toggle").textContent="+";
      });
      c.classList.add("open");
      c.querySelector(".ldr-toggle").textContent="\u2013";
    });
  });
})();
(function(){
  var wrap=document.querySelector(".hdr-wrap");
  var img=wrap.querySelector("img.hdr-img");
  var panel=wrap.querySelector(".leaders");
  var hideT,lockedOpen=false;
  function open(){clearTimeout(hideT);wrap.classList.add("show");document.body.style.overflow="hidden";}
  function close(){wrap.classList.remove("show");document.body.style.overflow="";lockedOpen=false;}
  function scheduleClose(){clearTimeout(hideT);hideT=setTimeout(function(){if(!lockedOpen)close();},420);}
  img.addEventListener("pointerenter",function(e){if(e.pointerType!=="touch")open();});
  img.addEventListener("pointerleave",function(e){if(e.pointerType!=="touch")scheduleClose();});
  panel.addEventListener("pointerenter",function(e){if(e.pointerType!=="touch")clearTimeout(hideT);});
  panel.addEventListener("pointerleave",function(e){if(e.pointerType!=="touch")scheduleClose();});
  img.addEventListener("click",function(e){
    e.stopPropagation();
    if(wrap.classList.contains("show")){close();}
    else{lockedOpen=true;open();}
  });
  document.addEventListener("click",function(e){
    if(!e.target.closest(".leaders")&&!e.target.closest("img.hdr-img"))close();
  });
  document.addEventListener("keydown",function(e){
    if(e.key==="Escape")close();
  });
})();
</script>
