<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TVK Varun – Coming Soon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=Newsreader:opsz,wght@6..72,400&display=swap" rel="stylesheet">
<style>
:root{
  --red:#9E0000; --gold:#FFCC00; --on-red:#FFF4D6; --on-gold:#2A0A0A;
  --head:"Bricolage Grotesque","Helvetica Neue",Arial,sans-serif;
  --body:"Newsreader",Georgia,"Times New Roman",serif;
  box-sizing:border-box;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--red:#6E0000;--gold:#E0B400}
}
:root[data-theme="dark"]{--red:#6E0000;--gold:#E0B400}
*{box-sizing:border-box}
html,body{min-height:100%;margin:0}
body{background:var(--red);color:var(--on-red);font-family:var(--body);font-size:1.2rem;line-height:1.6;display:flex;flex-direction:column;min-height:100vh;padding-top:env(safe-area-inset-top,0px)}
:focus-visible{outline:3px solid var(--on-gold);outline-offset:3px}
header,footer{padding:1.25rem}
.brand{font-family:var(--head);font-weight:800;font-size:clamp(1.4rem,4vw,1.9rem)}
main{flex:1;background:var(--gold);color:var(--on-gold);display:flex;align-items:center;padding:2.5rem 1.25rem}
.inner{max-width:1040px;width:100%;margin:0 auto;display:grid;gap:2rem;align-items:center}
@media (min-width:860px){.inner{grid-template-columns:1.1fr 1fr;gap:3rem}}
.status{display:inline-flex;align-items:center;gap:.6rem;font-family:var(--head);font-weight:700;margin-bottom:1rem}
.dot{display:inline-block;vertical-align:middle;width:.18em;height:.18em;margin:0 .22em .08em 0;border-radius:50%;background:var(--red)}
h1{font-family:var(--head);font-weight:800;font-size:clamp(2.4rem,11vw,4.4rem);line-height:1;letter-spacing:-.03em;margin:0 0 1.5rem;white-space:nowrap}
@media (min-width:860px){h1{font-size:min(6.2vw,4.4rem)}}
p{max-width:40ch;margin:0 0 1.75rem}
.btn{display:inline-block;font-family:var(--head);font-weight:700;padding:.9rem 1.5rem;border-radius:6px;text-decoration:none;background:var(--red);color:var(--on-red)}
.btn:hover{filter:brightness(1.15)}

.about{background:#FFF8E1;color:#2A0A0A;padding:3rem 1.25rem}
.about div{max-width:1040px;margin:0 auto}
.about h2{font-family:var(--head);font-weight:800;font-size:1.8rem;margin:0 0 .5rem}
.about p{max-width:60ch;margin:0}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .about{background:#1C0D0D;color:#FFF4D6}}
footer{text-align:center;font-size:.95rem;padding-bottom:calc(1.25rem + env(safe-area-inset-bottom,0px))}
@media (prefers-reduced-motion:no-preference){.dot{animation:pulse 2s ease-in-out infinite}}
@keyframes pulse{50%{opacity:.35}}

.flag{border-radius:4px;box-shadow:0 10px 30px rgba(42,10,10,.35);width:100%;height:auto;aspect-ratio:3/2;display:block;overflow:hidden;cursor:pointer}
.flag *{transform-box:view-box}
.s1{animation:inL 1s cubic-bezier(.7,0,.2,1) backwards}
.s2{animation:inR 1s cubic-bezier(.7,0,.2,1) .55s backwards}
.s3{animation:inR 1s cubic-bezier(.7,0,.2,1) 1.1s backwards}
@keyframes inL{from{transform:translateX(-1080px)}}
@keyframes inR{from{transform:translateX(1080px)}}
.el-l{animation:eleL 1.2s cubic-bezier(.2,.8,.2,1) 1.8s backwards}
.el-r{animation:eleR 1.2s cubic-bezier(.2,.8,.2,1) 1.8s backwards}
@keyframes eleL{from{transform:translateX(-520px)}}
@keyframes eleR{from{transform:translateX(520px)}}
.emb{transform-origin:540.5px 359.5px;animation:embIn .9s ease-out 2.6s backwards}
@keyframes embIn{from{opacity:0;transform:scale(.5) rotate(-90deg)}}
.stars{transform-origin:540.5px 359.5px;animation:spin 28s linear 2.8s infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.fl{transform-origin:540px 451px;animation:bloom 1.4s cubic-bezier(.2,.9,.3,1.2) 3.2s backwards,sway 6s ease-in-out 4.6s infinite}
@keyframes bloom{from{opacity:0;transform:scale(.2) rotate(-25deg)}}
@keyframes sway{25%{transform:rotate(2.5deg)}75%{transform:rotate(-2.5deg)}}
@media (prefers-reduced-motion:reduce){.flag *{animation:none!important}}
header{display:flex;align-items:center;justify-content:space-between;gap:1rem;padding-top:.6rem;padding-bottom:.6rem}
.hdr-img{height:clamp(46px,11vw,96px);width:auto;max-width:60%;object-fit:contain;display:block}
</style>
</head>
